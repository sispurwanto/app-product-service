name: Deploy Development

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Environments Folder
        run: mkdir -p src/environments

      - name: Create environment.ts (Base)
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
        run: echo "$ENV_DEV" > src/environments/environment.ts

      - name: Create environment.development.ts
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
        run: echo "$ENV_DEV" > src/environments/environment.development.ts

      - name: Create environment.prod.ts (Fallback)
        env:
          ENV_DEV: ${{ secrets.ENV_DEV }}
        run: echo "$ENV_DEV" > src/environments/environment.prod.ts

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Development
        run: npm run deploy:dev
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
