<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1"/>

  <!-- WebCare Shield and Checkmark -->
  <g filter="url(#glow)">
    <path 
      d="M16 26.5C16 26.5 24 22 24 14.5V7.5L16 4.5L8 7.5V14.5C8 22 16 26.5 16 26.5Z" 
      fill="url(#shieldGrad)" 
      fill-opacity="0.2"
      stroke="url(#shieldGrad)" 
      stroke-width="2" 
      stroke-linejoin="round"/>
    <path 
      d="M12.5 14.5L15 17L20 11.5" 
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"/>
  </g>
</svg>
